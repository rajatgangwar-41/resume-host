name: maintain
# Keeps the hosted archive clean:
#  - daily: auto-delete applications older than retentionDays (90 = 3 months)
#  - repository_dispatch "delete-application": the Delete button on documents.html
#  - workflow_dispatch: manual prune / delete from the Actions tab
on:
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [delete-application]
  workflow_dispatch:
    inputs:
      id:
        description: "Application id (or TAG) to delete; empty = prune only"
        required: false
        default: ""
      file:
        description: "Optional: only this file (resume|coverLetter|linkedin|prepare)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: maintain
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete requested application / file
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.id != '')
        env:
          TARGET: ${{ github.event.client_payload.id || inputs.id }}
          KEY: ${{ github.event.client_payload.file || inputs.file }}
        run: bash scripts/maintain.sh delete "$TARGET" $KEY || true
      - name: Prune expired applications
        run: bash scripts/maintain.sh prune
      - name: Commit and push
        run: |
          git config user.name  "resume-host bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "maintain: ${{ github.event_name }} $(date -u +%F)"
          git push
